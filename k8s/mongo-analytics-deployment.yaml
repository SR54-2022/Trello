apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: mongo-analytics
  name: mongo-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mongo-analytics
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: mongo-analytics
    spec:
      containers:
        - env:
            - name: MONGO_INITDB_DATABASE
              value: mongoAnalytics
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: pass
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
          image: mongo
          livenessProbe:
            exec:
              command:
                - echo 'db.runCommand("ping").ok'
            failureThreshold: 10
            periodSeconds: 10
            timeoutSeconds: 10
          name: mongo-analytics
          ports:
            - containerPort: 27017
              protocol: TCP
          resources:
            limits:
              cpu: 500m
          volumeMounts:
            - mountPath: /data/db
              name: mongo-analytics-store
      restartPolicy: Always
      volumes:
        - name: mongo-analytics-store
          persistentVolumeClaim:
            claimName: mongo-analytics-store
