apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: notification-server
  name: notification-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: notification-server
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: notification-server
    spec:
      containers:
        - env:
            - name: CASSANDRA_HOST
              value: cassandra
            - name: CASSANDRA_KEYSPACE
              value: notifications
            - name: CASSANDRA_PORT
              value: "9042"
            - name: JAEGER_ADDRESS
              value: http://jaeger:14268/api/traces
            - name: LINK_TO_PROJECT_SERVICE
              value: https://project-server:8080
            - name: LINK_TO_TASK_SERVICE
              value: https://task-server:8080
            - name: LINK_TO_USER_SERVICE
              value: https://user-server:8080
            - name: NATS_URL
              value: nats://nats:4222
            - name: PORT
              value: "8080"
          image: notification-server
          name: notification-service
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 500m
          volumeMounts:
            - mountPath: /app/app.log
              name: notification-server-cm0
              subPath: app.log
            - mountPath: /app/cert.crt
              name: notification-server-cm1
              subPath: cert.crt
            - mountPath: /app/privat.key
              name: notification-server-cm2
              subPath: privat.key
      hostname: notification-service
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: app.log
                path: app.log
            name: notification-server-cm0
          name: notification-server-cm0
        - configMap:
            items:
              - key: cert.crt
                path: cert.crt
            name: notification-server-cm1
          name: notification-server-cm1
        - configMap:
            items:
              - key: privat.key
                path: privat.key
            name: notification-server-cm2
          name: notification-server-cm2
