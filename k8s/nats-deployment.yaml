apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: nats
  name: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: nats
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: nats
    spec:
      containers:
        - env:
            - name: NATS_URL
              value: nats://nats:4222
          image: nats:latest
          name: nats
          ports:
            - containerPort: 4222
              protocol: TCP
          resources:
            limits:
              cpu: 500m
      restartPolicy: Always
