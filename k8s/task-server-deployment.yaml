apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: task-server
  name: task-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: task-server
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: task-server
    spec:
      containers:
        - env:
            - name: HDFS_ADDRESS
              value: hdfs://namenode:9000
            - name: USER_SERVICE_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: env
          image: task-server
          name: task-server
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 500m
          volumeMounts:
            - mountPath: /app/app.log
              name: task-server-cm0
              subPath: app.log
            - mountPath: /app/cert.crt
              name: task-server-cm1
              subPath: cert.crt
            - mountPath: /app/privat.key
              name: task-server-cm2
              subPath: privat.key
      hostname: task-server
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: app.log
                path: app.log
            name: task-server-cm0
          name: task-server-cm0
        - configMap:
            items:
              - key: cert.crt
                path: cert.crt
            name: task-server-cm1
          name: task-server-cm1
        - configMap:
            items:
              - key: privat.key
                path: privat.key
            name: task-server-cm2
          name: task-server-cm2
