apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: user-server
  name: user-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: user-server
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: user-server
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: env
          image: user-server
          name: user-server
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 500m
          volumeMounts:
            - mountPath: /app/10k-worst-passwords.txt
              name: user-server-cm0
              subPath: 10k-worst-passwords.txt
            - mountPath: /app/cert.crt
              name: user-server-cm1
              subPath: cert.crt
            - mountPath: /app/privat.key
              name: user-server-cm2
              subPath: privat.key
            - mountPath: /app/app.log
              name: user-server-cm3
              subPath: app.log
      hostname: user-server
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: 10k-worst-passwords.txt
                path: 10k-worst-passwords.txt
            name: user-server-cm0
          name: user-server-cm0
        - configMap:
            items:
              - key: cert.crt
                path: cert.crt
            name: user-server-cm1
          name: user-server-cm1
        - configMap:
            items:
              - key: privat.key
                path: privat.key
            name: user-server-cm2
          name: user-server-cm2
        - configMap:
            items:
              - key: app.log
                path: app.log
            name: user-server-cm3
          name: user-server-cm3
