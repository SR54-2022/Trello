apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: angular-app
  name: angular-app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: angular-app
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: angular-app
    spec:
      containers:
        - env:
            - name: CHOKIDAR_USEPOLLING
              value: "true"
          image: angular-app
          name: angular-app
          ports:
            - containerPort: 4200
              protocol: TCP
          resources:
            limits:
              cpu: 500m
          volumeMounts:
            - mountPath: /app/node_modules
              name: angular-app-claim1
            - mountPath: /app/api-gateway
              name: angular-app-cm2
      restartPolicy: Always
      volumes:
        - name: angular-app-claim1
          persistentVolumeClaim:
            claimName: angular-app-claim1
        - configMap:
            name: angular-app-cm2
          name: angular-app-cm2
