apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: tracing
  name: tracing
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: tracing
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: tracing
    spec:
      containers:
        - env:
            - name: COLLECTOR_ZIPKIN_HTTP_PORT
              value: "9411"
            - name: JAEGER_ADDRESS
              value: http://jaeger:14268/api/traces
          image: jaegertracing/all-in-one:latest
          name: jaeger
          ports:
            - containerPort: 6831
              protocol: UDP
            - containerPort: 16686
              protocol: TCP
          resources:
            limits:
              cpu: 500m
      restartPolicy: Always
