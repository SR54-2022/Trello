apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: analytic-service
  name: analytic-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: analytic-service
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: analytic-service
    spec:
      containers:
        - env:
            - name: EVENTSTORE_ADDRESS
              value: eventstore-db:2113
          envFrom:
            - configMapRef:
                name: env
          image: analytic-service
          name: analytic-server
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 500m
          volumeMounts:
            - mountPath: /app/app.log
              name: analytic-service-cm0
              subPath: app.log
            - mountPath: /usr/local/share/ca-certificates/cert.crt
              name: analytic-service-cm1
              subPath: cert.crt
            - mountPath: /app/privat.key
              name: analytic-service-cm2
              subPath: privat.key
            - mountPath: /app/cert.crt
              name: analytic-service-cm3
              subPath: cert.crt
      hostname: analytic-server
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: app.log
                path: app.log
            name: analytic-service-cm0
          name: analytic-service-cm0
        - configMap:
            items:
              - key: cert.crt
                path: cert.crt
            name: analytic-service-cm1
          name: analytic-service-cm1
        - configMap:
            items:
              - key: privat.key
                path: privat.key
            name: analytic-service-cm2
          name: analytic-service-cm2
        - configMap:
            items:
              - key: cert.crt
                path: cert.crt
            name: analytic-service-cm3
          name: analytic-service-cm3
