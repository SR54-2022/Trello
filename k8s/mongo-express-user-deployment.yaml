apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: mongo-express-user
  name: mongo-express-user
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mongo-express-user
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: mongo-express-user
    spec:
      containers:
        - env:
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              value: admin
            - name: ME_CONFIG_BASICAUTH_USERNAME
              value: admin
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              value: pass
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              value: root
            - name: ME_CONFIG_MONGODB_SERVER
              value: mongo-user
            - name: ME_CONFIG_MONGODB_URL
              value: mongodb://root:pass@mongo-user:27017
          image: mongo-express
          name: mongo-express-user
          ports:
            - containerPort: 8081
              protocol: TCP
          resources:
            limits:
              cpu: 500m
          volumeMounts:
            - mountPath: /data/db
              name: mong-user-express-data
      restartPolicy: Always
      volumes:
        - name: mong-user-express-data
          persistentVolumeClaim:
            claimName: mong-user-express-data
